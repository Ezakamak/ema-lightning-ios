name: Bug report / Hata bildirimi
description: Report a reproducible problem / Tekrarlanabilir bir hata bildirin
title: '[Bug]: '
body:
  - type: input
    id: version
    attributes:
      label: App version or commit / Sürüm veya commit
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device, iOS and Xcode / Cihaz, iOS ve Xcode
      placeholder: iPhone model, iOS version, Xcode version if built locally
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected and actual result / Adımlar, beklenen ve gerçek sonuç
      description: Include a short non-sensitive input example. Do not share signing secrets or private text.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / İlgili günlükler
      description: Remove personal data and secrets first.
