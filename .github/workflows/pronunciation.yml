name: Pronunciation dictionary checks
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: pronunciation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/pronunciation-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - name: Text preparation and large dictionary regression
        working-directory: .
        run: node --test tests/test-text-preparation.mjs tests/test-pronunciation-scale.mjs
      - name: Reproduce pinned candidate data
        working-directory: .
        run: |
          curl --fail --location https://raw.githubusercontent.com/cmusphinx/cmudict/74790861f652b15e4ac49015a90074ad62a27690/cmudict.dict -o /tmp/cmudict.dict
          python3 scripts/generate-pronunciation-candidates.py --source /tmp/cmudict.dict --output /tmp/candidates.jsonl
          gzip -dc data/pronunciation/candidates.jsonl.gz | cmp - /tmp/candidates.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pronunciation-quality
          path: data/pronunciation/*.report.json
  swift:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Select release toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
      - name: SpeechCore tests
        run: swift test --package-path Packages/SpeechCore
      - name: Focused sync and offline EMA tests
        run: |
          mkdir -p build
          python3 scripts/boot-sync-simulator.py 2>&1 | tee build/simulator-boot.log
          device=$(cat build/simulator-id)
          xcodebuild test -project EMALightning.xcodeproj -scheme EMALightning -destination "platform=iOS Simulator,id=$device" -only-testing:EMAIntegrationTests/PronunciationSyncTests -test-timeouts-enabled YES -maximum-test-execution-time-allowance 240 -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 CODE_SIGNING_ALLOWED=NO -resultBundlePath build/Pronunciation.xcresult
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pronunciation-test-results
          path: |
            build/Pronunciation.xcresult
            build/simulator-boot.log
            build/simulator-diagnostics.json
