name: EMA Lightning TestFlight upload
on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: App Store version
        required: true
        default: '0.1.0'
      build_number:
        description: Optional build number (defaults to workflow run number)
        required: false

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      VERSION: ${{ inputs.marketing_version }}
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
      ARCHIVE_PATH: build/EMALightning.xcarchive
      EXPORT_PATH: build/app-store-export
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Validate version and existing Apple secrets
        run: |
          set -euo pipefail
          for key in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID ASC_PRIVATE_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "::error title=Missing secret::$key is not configured in this repository."
              exit 1
            fi
          done
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] && (( BUILD_NUMBER > 0 ))
          mkdir -p "$HOME/private_keys" build
          chmod 700 "$HOME/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive signed EMA Lightning
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project EMALightning.xcodeproj \
            -scheme EMALightning \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          test -d "$ARCHIVE_PATH/Products/Applications/EMALightning.app"
          /usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' "$ARCHIVE_PATH/Info.plist" | grep -Fx 'net.ekatech.ema-lightning-ios'

      - name: Prepare App Store export options
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>signingStyle</key><string>automatic</string>
          <key>teamID</key><string>${APPLE_TEAM_ID}</string>
          <key>destination</key><string>export</string>
          <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF

      - name: Export signed IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' | grep -q .

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' -print -quit)"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload export logs for troubleshooting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ema-testflight-export
          if-no-files-found: warn
          path: |
            build/ExportOptions.plist
            build/app-store-export/ExportOptions.plist
            build/EMALightning.xcarchive/Info.plist
