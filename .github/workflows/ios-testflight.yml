name: EMA Lightning TestFlight upload
on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: App Store version
        required: true
        default: '0.1.0'
      build_number:
        description: Optional build number (defaults to run number and attempt)
        required: false

permissions:
  contents: read

concurrency:
  group: testflight-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      VERSION: ${{ inputs.marketing_version }}
      BUILD_NUMBER: ${{ inputs.build_number || format('{0}.{1}', github.run_number, github.run_attempt) }}
      ARCHIVE_PATH: build/EMALightning.xcarchive
      EXPORT_PATH: build/app-store-export
      ASC_KEY_DIRECTORY: /tmp/ema-asc-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate Apple API and provisioning before compiling
        run: |
          node scripts/check-apple-api.cjs
          python3 scripts/check-repository.py
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_26.5.app/Contents/Developer || { echo "::error::Xcode 26.5 is missing from the runner image"; exit 1; }
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun altool --help

      - name: Validate version and existing Apple secrets
        run: |
          set -euo pipefail
          for key in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID ASC_PRIVATE_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "::error title=Missing secret::$key is not configured in this repository."
              exit 1
            fi
          done
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,3}(\.[0-9]{1,2})?(\.[0-9]{1,2})?$ ]]
          mkdir -p build

      - name: Archive signed EMA Lightning
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project EMALightning.xcodeproj \
            -scheme EMALightning \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_DIRECTORY/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          test -d "$ARCHIVE_PATH/Products/Applications/EMALightning.app"
          /usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' "$ARCHIVE_PATH/Info.plist" | grep -Fx 'net.ekatech.ema-lightning-ios.627Y9N4Q6P'

      - name: Prepare App Store export options
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>signingStyle</key><string>automatic</string>
          <key>teamID</key><string>${APPLE_TEAM_ID}</string>
          <key>destination</key><string>export</string>
          <key>uploadSymbols</key><true/>
          <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF

      - name: Export signed IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_DIRECTORY/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' | grep -q .
          echo 'Signed Release IPA export succeeded.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          export API_PRIVATE_KEYS_DIR="$ASC_KEY_DIRECTORY"
          IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' -print -quit)"
          xcrun altool --upload-package "$IPA_PATH" --type ios \
            --apple-id "$ASC_APP_ID" \
            --bundle-id net.ekatech.ema-lightning-ios.627Y9N4Q6P \
            --bundle-version "$BUILD_NUMBER" \
            --bundle-short-version-string "$VERSION" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo 'Apple upload command succeeded. TestFlight processing and tester availability must be checked separately.' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve signed IPA for upload recovery
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-testflight-ipa
          path: build/app-store-export/*.ipa
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload export logs for troubleshooting
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ema-testflight-export
          if-no-files-found: warn
          path: |
            build/ExportOptions.plist
            build/app-store-export/ExportOptions.plist
            build/EMALightning.xcarchive/Info.plist

      - name: Remove API private key
        if: always()
        run: rm -rf "$ASC_KEY_DIRECTORY"
