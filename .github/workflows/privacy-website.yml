name: Privacy website checks
on:
  workflow_dispatch:
  pull_request:
    paths: ['web/privacy/**', '.github/workflows/privacy-website.yml']
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node web/privacy/scripts/build.mjs
      - run: node --test web/privacy/tests/*.test.mjs
