name: Prepare build 113 direct and portable downloads
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  delivery:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-ipa
          run-id: 42707542259
          github-token: ${{ github.token }}
          path: incoming
      - name: Verify original IPA and create a plain portable ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          ipa=Path('incoming/build/EMALightning-0.2.0-unsigned.ipa')
          digest=hashlib.sha256(ipa.read_bytes()).hexdigest()
          assert digest == 'd072d6d823cb853a08127fb7fb202dfcbb131573d179fd97cb15e2e1409800b5'
          assert zipfile.ZipFile(ipa).testzip() is None
          Path('SHA256SUMS-build113.txt').write_text(f'{digest}  {ipa.name}\n')
          with zipfile.ZipFile('EMA-iOS-0.2.0-build113-portable.zip','w',compression=zipfile.ZIP_STORED,allowZip64=False) as z:
              z.writestr(ipa.name,ipa.read_bytes())
              z.writestr('SHA256SUMS',f'{digest}  {ipa.name}\n')
          assert zipfile.ZipFile('EMA-iOS-0.2.0-build113-portable.zip').testzip() is None
          PY
      - name: Verify portable ZIP with Apple's ditto
        run: |
          ditto -x -k EMA-iOS-0.2.0-build113-portable.zip portable-extracted
          cmp incoming/build/EMALightning-0.2.0-unsigned.ipa portable-extracted/EMALightning-0.2.0-unsigned.ipa
      - name: Check original GitHub ZIP with Apple's ditto
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api repos/Ezakamak/ema-lightning-ios/actions/artifacts/13715325452/zip > original-github-artifact.zip
          if ditto -x -k original-github-artifact.zip original-extracted; then
            echo "Original GitHub ZIP also passed macOS ditto extraction." > ZIP-COMPATIBILITY.txt
          else
            echo "Original GitHub ZIP failed macOS ditto extraction; portable ZIP passed." > ZIP-COMPATIBILITY.txt
          fi
          cat ZIP-COMPATIBILITY.txt
      - name: Attach direct IPA and portable ZIP to the existing private draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh release view diagnostics-build113 --json isDraft --jq .isDraft)" = true
          gh release upload diagnostics-build113 --clobber \
            incoming/build/EMALightning-0.2.0-unsigned.ipa \
            EMA-iOS-0.2.0-build113-portable.zip SHA256SUMS-build113.txt ZIP-COMPATIBILITY.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-build113-downloads
          path: |
            EMA-iOS-0.2.0-build113-portable.zip
            SHA256SUMS-build113.txt
            ZIP-COMPATIBILITY.txt
